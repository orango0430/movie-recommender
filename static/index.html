<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 추천 검색</title>
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --border: #e5e2dc; --text: #1f1d1a; --muted: #6f6a62;
    --accent: #c2410c; --accent-soft: #fdeee6; --chip: #f1efea; --bar: #e9e5de;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --surface: #1e1c1a; --border: #34302b; --text: #ece8e2; --muted: #a39d94;
      --accent: #fb923c; --accent-soft: #3a2418; --chip: #2a2724; --bar: #34302b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 8px 14px; font: inherit; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--text); color: var(--bg); }
  select, input, .go { font: inherit; color: var(--text); background: var(--surface);
         border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; font-size: 16px; }
  .go { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  .examples { margin: 10px 0 24px; font-size: 13px; color: var(--muted); }
  .examples button { border: 1px solid var(--border); background: var(--surface); color: var(--text);
         border-radius: 99px; padding: 3px 10px; margin: 0 4px 4px 0; font: inherit; cursor: pointer; }
  .status { color: var(--muted); font-size: 13px; margin: 8px 0 12px; min-height: 20px; }
  .error { color: var(--accent); }
  .base { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .title { font-weight: 650; font-size: 16px; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .rank { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 12px; margin: 0 4px 4px 0; }
  .reason { background: var(--accent-soft); color: var(--accent); }
  .overview { font-size: 14px; margin: 6px 0 8px; }
  .score { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .score i { display: block; width: 64px; height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  .score i b { display: block; height: 100%; background: var(--accent); }
  .more { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
  /* 세 방식 나란히 */
  body.wide main { max-width: 1280px; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .cols h3 { font-size: 14px; margin: 0 0 8px; }
  .cols h3 small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .cols .card { padding: 10px 12px; }
  .cols .overview { display: none; }
  .cols .head { flex-direction: column; gap: 2px; }
  .cols .title { font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .head { flex-direction: column; gap: 4px; } }
</style>
</head>
<body>
<main>
  <h1>영화 추천 검색</h1>
  <div class="sub">줄거리 유사도 추천 · 로컬에서만 동작</div>

  <div class="bar">
    <div class="seg" id="mode">
      <button data-m="text" class="on">문장으로 찾기</button>
      <button data-m="similar">비슷한 영화</button>
    </div>
    <select id="data" aria-label="데이터"></select>
    <select id="method" aria-label="추천 방식">
      <option value="tfidf">단어 겹침 (TF-IDF)</option>
      <option value="embed">줄거리 뜻 (임베딩)</option>
      <option value="hybrid">혼합 (뜻 70% + 단어 30%)</option>
      <option value="compare">세 방식 나란히</option>
    </select>
  </div>
  <form class="search" id="form">
    <input id="q" list="titles" autocomplete="off" placeholder="예: 복수를 다룬 스릴러" aria-label="검색어">
    <datalist id="titles"></datalist>
    <button class="go" type="submit">검색</button>
  </form>
  <div class="examples" id="examples"></div>

  <div class="status" id="status"></div>
  <div id="base"></div>
  <div id="results"></div>
  <footer>영화 데이터: 한국영상자료원 KMDb</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let mode = 'text';
let datasets = [];
const METHOD_NAMES = { tfidf: ['단어 겹침', 'TF-IDF'], embed: ['줄거리 뜻', '임베딩'], hybrid: ['혼합', '뜻 70% + 단어 30%'] };

const EXAMPLES = {
  text: ['복수를 다룬 스릴러', '깡패를 소탕하는 경찰', '죽은 사람이 유령이 되어 돌아온다', '시간을 되돌리는 사랑 이야기', '아이를 키우는 가족'],
  similar: { csv: ['보이스 (2021)', '브로커 (2022)', '이 안에 외계인이 있다', '22 (2015)'],
             sample: ['기생충', '범죄도시', '겨울왕국', '인터스텔라'],
             api: ['기생충', '범죄도시 (2017)', '극한직업', '마션', '겨울왕국 2'] },
};

function syncMethods() {
  // 임베딩을 미리 만들어 둔 데이터에서만 임베딩·혼합·나란히 비교를 고를 수 있다
  const d = datasets.find((x) => x.id === $('data').value);
  const ok = d && d.embed;
  [...$('method').options].forEach((o) => { if (o.value !== 'tfidf') o.disabled = !ok; });
  if (!ok) $('method').value = 'tfidf';
}

function renderExamples() {
  const list = mode === 'text' ? EXAMPLES.text : (EXAMPLES.similar[$('data').value] || []);
  $('examples').innerHTML = '예시 ' + list.map((x) => `<button type="button">${esc(x)}</button>`).join('');
  $('examples').querySelectorAll('button').forEach((b) => b.onclick = () => { $('q').value = b.textContent; run(); });
  $('q').placeholder = mode === 'text' ? '예: 복수를 다룬 스릴러' : '영화 제목 (동명이면 "제목 (연도)")';
}

function card(m, n) {
  const pct = Math.round(Math.min(m.score / 0.6, 1) * 100);
  const title = m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a>` : esc(m.label);
  return `<div class="card">
    <div class="head">
      <div class="title"><span class="rank">${n}</span>${title}</div>
      <div class="score">유사도 ${m.score.toFixed(3)} <i><b style="width:${pct}%"></b></i></div>
    </div>
    <div class="meta">${m.genres.map((g) => `<span class="chip">${esc(g)}</span>`).join('')}${m.director ? ' · 감독 ' + esc(m.director.replaceAll('|', ', ')) : ''}</div>
    ${m.reasons.length ? `<div>${m.reasons.map((r) => `<span class="chip reason">${esc(r)}</span>`).join('')}</div>` : ''}
    <div class="overview">${esc(m.overview)}</div>
    <button class="more" data-label="${esc(m.label)}">이 영화와 비슷한 영화 →</button>
  </div>`;
}

function search(method, top) {
  const params = new URLSearchParams({ q: $('q').value.trim(), mode, method, data: $('data').value, top });
  return fetch('/api/search?' + params).then((x) => x.json());
}

function wireMore() {
  $('results').querySelectorAll('.more').forEach((b) => b.onclick = () => {
    setMode('similar'); $('q').value = b.dataset.label; run(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

async function run() {
  if (!$('q').value.trim()) return;
  const method = $('method').value;
  const compare = method === 'compare';
  document.body.classList.toggle('wide', compare);
  $('status').textContent = '검색 중…';
  $('results').innerHTML = ''; $('base').innerHTML = '';
  try {
    if (!compare) {
      const r = await search(method, 10);
      if (r.error) { $('status').innerHTML = `<span class="error">${esc(r.error)}</span>`; return; }
      $('status').textContent = `영화 ${r.count.toLocaleString()}편 중 상위 ${r.results.length}개 · ${METHOD_NAMES[method][0]}`;
      if (r.base) $('base').innerHTML = `<div class="base"><b>${esc(r.base.label)}</b> 와 비슷한 영화<div class="overview">${esc(r.base.overview)}</div></div>`;
      $('results').innerHTML = r.results.map((m, i) => card(m, i + 1)).join('') || '<div class="status">결과 없음</div>';
    } else {
      const methods = ['tfidf', 'embed', 'hybrid'];
      const rs = await Promise.all(methods.map((m) => search(m, 5)));
      const err = rs.find((r) => r.error);
      if (err) { $('status').innerHTML = `<span class="error">${esc(err.error)}</span>`; return; }
      $('status').innerHTML = `영화 ${rs[0].count.toLocaleString()}편 · 같은 검색을 세 방식으로 <span class="note">(유사도 숫자는 방식마다 척도가 달라 서로 비교하지 않는다)</span>`;
      if (rs[0].base) $('base').innerHTML = `<div class="base"><b>${esc(rs[0].base.label)}</b> 와 비슷한 영화<div class="overview">${esc(rs[0].base.overview)}</div></div>`;
      $('results').innerHTML = '<div class="cols">' + rs.map((r, k) => `<div>
        <h3>${METHOD_NAMES[methods[k]][0]}<small>${METHOD_NAMES[methods[k]][1]}</small></h3>
        ${r.results.map((m, i) => card(m, i + 1)).join('') || '<div class="status">결과 없음</div>'}</div>`).join('') + '</div>';
    }
    wireMore();
  } catch (e) {
    $('status').innerHTML = '<span class="error">서버에 연결할 수 없습니다. python web.py 가 켜져 있는지 확인하세요.</span>';
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#mode button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  renderExamples();
}

let timer;
$('q').addEventListener('input', () => {
  if (mode !== 'similar') return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const list = await fetch('/api/titles?' + new URLSearchParams({ q: $('q').value, data: $('data').value })).then((x) => x.json());
    $('titles').innerHTML = list.map((t) => `<option value="${esc(t)}">`).join('');
  }, 200);
});
document.querySelectorAll('#mode button').forEach((b) => b.onclick = () => setMode(b.dataset.m));
$('data').onchange = () => { syncMethods(); renderExamples(); if ($('q').value) run(); };
$('method').onchange = () => { if ($('q').value) run(); };
$('form').onsubmit = (e) => { e.preventDefault(); run(); };

fetch('/api/datasets').then((x) => x.json()).then((ds) => {
  datasets = ds;
  $('data').innerHTML = ds.map((d) => `<option value="${d.id}">${esc(d.name)}${d.embed ? '' : ' (임베딩 없음)'}</option>`).join('');
  // 비교 결과 혼합이 가장 나아서(docs/EMBEDDING.md) 임베딩이 있으면 혼합을 기본으로
  if (ds[0] && ds[0].embed) $('method').value = 'hybrid';
  syncMethods();
  renderExamples();
});
</script>
</body>
</html>
